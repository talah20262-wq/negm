<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.NAJM | Professional Web Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0a; color: #e5e5e5; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-gold { background: linear-gradient(45deg, #d4af37, #f9d71c); color: black; }
        .admin-gear { position: fixed; bottom: 20px; left: 20px; font-size: 24px; color: #333; cursor: pointer; transition: 0.3s; }
        .admin-gear:hover { color: #d4af37; transform: rotate(90deg); }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="p-6 flex justify-between items-center border-b border-white/10">
        <div class="text-2xl font-black tracking-tighter text-white">M.NAJM<span class="text-yellow-500">.</span></div>
        <div class="flex gap-4">
            <a href="https://wa.me/201211056530" class="text-sm border border-white/20 px-4 py-2 rounded-lg">تواصل مباشر</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="py-20 text-center px-4">
        <h1 class="text-5xl font-extrabold text-white mb-4">صناعة المتاجر بذكاء</h1>
        <p class="text-gray-400 max-w-xl mx-auto">خبرة 3 سنوات في بناء أكثر من 90 مشروعاً رقمياً ناجحاً.</p>
    </section>

    <!-- Plans -->
    <section class="container mx-auto grid md:grid-cols-2 gap-8 px-6 pb-20">
        <div class="glass-card p-8 rounded-3xl text-center">
            <h3 class="text-xl font-bold mb-2">المتجر العادي</h3>
            <div class="text-3xl font-black text-yellow-500 mb-6">200 ج / شهرياً</div>
            <button onclick="payFlow('200 ج')" class="btn-gold w-full py-4 rounded-xl font-bold uppercase tracking-wider">ادفع واشترك الآن</button>
        </div>
        <div class="glass-card p-8 rounded-3xl text-center border-yellow-500/50 border-2">
            <h3 class="text-xl font-bold mb-2">العرض السنوي</h3>
            <div class="text-3xl font-black text-yellow-500 mb-6">2000 ج / سنوياً</div>
            <button onclick="payFlow('2000 ج')" class="btn-gold w-full py-4 rounded-xl font-bold uppercase tracking-wider">ادفع واشترك الآن</button>
        </div>
    </section>

    <!-- Hidden Admin Gear -->
    <div class="admin-gear" onclick="adminLogin()"><i class="fas fa-cog"></i></div>

    <script>
        const DB_URL = "https://talah-c12c5-default-rtdb.asia-southeast1.firebasedatabase.app/";

        // 1. نظام الدفع (Orange Cash)
        async function payFlow(amount) {
            const { value: file } = await Swal.fire({
                title: 'بوابة الدفع السريع',
                html: `<div class="text-right text-sm">
                    1. حول مبلغ <b>${amount}</b> لرقم أورنج كاش: <br>
                    <center><b class="text-xl text-orange-500">01206561893</b></center><br>
                    2. بعد التحويل، ارفع صورة إيصال الدفع (سكرين شوت) هنا:
                </div>`,
                input: 'file',
                inputAttributes: { 'accept': 'image/*', 'aria-label': 'ارفع صورة الوصل' },
                confirmButtonText: 'إرسال الوصل للمراجعة',
                confirmButtonColor: '#d4af37'
            });

            if (file) {
                // هنا بنرفع البيانات لفايربيز (إشعار للأونر)
                const reader = new FileReader();
                reader.onload = async (e) => {
                    await fetch(`${DB_URL}payment_requests.json`, {
                        method: 'POST',
                        body: JSON.stringify({
                            amount: amount,
                            receipt: e.target.result, // الصورة Base64
                            status: 'pending',
                            time: new Date().toLocaleString()
                        })
                    });
                    Swal.fire('تم الإرسال', 'في انتظار الموافقة من الأونر (محمد نجم)... ستحصل على إشعار فور التفعيل.', 'success');
                };
                reader.readAsDataURL(file);
            }
        }

        // 2. نظام المالك (Login)
        async function adminLogin() {
            const { value: password } = await Swal.fire({
                title: 'دخول المالك',
                input: 'password',
                inputPlaceholder: 'أدخل كلمة السر',
                confirmButtonText: 'دخول'
            });

            if (password === "najm2026") { // غير كلمة السر دي براحتك
                window.location.href = "admin.html"; // هيحولك لصفحة الإدارة
            } else {
                Swal.fire('خطأ', 'كلمة سر غير صحيحة يا إمبراطور', 'error');
            }
        }
    </script>
</body>
</html>
